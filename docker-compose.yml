services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-redytelca}
      DB_USER: ${DB_USER:-redytelca}
      DB_PASS: ${DB_PASS:-redytelca_pass}
      REDYTELCA_INITIAL_ADMIN_USERNAME: ${REDYTELCA_INITIAL_ADMIN_USERNAME:-}
      REDYTELCA_INITIAL_ADMIN_EMAIL: ${REDYTELCA_INITIAL_ADMIN_EMAIL:-}
      REDYTELCA_INITIAL_ADMIN_PASSWORD: ${REDYTELCA_INITIAL_ADMIN_PASSWORD:-}
      REDYTELCA_BASE_URL: ${REDYTELCA_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-REDYTELCA}
      # Orígenes permitidos para CORS (conexion.php). Ajusta si accedes
      # desde otro host/puerto que no sea localhost:8080.
      REDYTELCA_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-redytelca}
      MYSQL_USER: ${DB_USER:-redytelca}
      MYSQL_PASSWORD: ${DB_PASS:-redytelca_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pass}
    # El esquema versionable y sin datos privados es la fuente de instalación.
    volumes:
      - db_data:/var/lib/mysql
      - ./bd_redytelca_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./bd_redytelca_seed.sql:/docker-entrypoint-initdb.d/02-rbac-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
